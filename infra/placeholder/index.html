<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Capacitación RR / AS400</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: "Segoe UI", system-ui, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      text-align: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, .35);
    }
    .logo {
      width: 56px; height: 56px;
      margin: 0 auto 20px;
      display: grid; place-items: center;
      background: #0ea5e9;
      border-radius: 14px;
      color: #fff;
    }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    .badge {
      display: inline-block;
      margin-bottom: 16px;
      padding: 4px 12px;
      border-radius: 999px;
      background: #334155;
      color: #38bdf8;
      font-size: .8rem;
      letter-spacing: .04em;
    }
    p { color: #cbd5e1; line-height: 1.6; font-size: .95rem; }
    .status {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #334155;
      font-size: .85rem;
      color: #94a3b8;
    }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"></rect>
        <line x1="8" y1="21" x2="16" y2="21"></line>
        <line x1="12" y1="17" x2="12" y2="21"></line>
      </svg>
    </div>
    <span class="badge">RR / AS400 · v3.0</span>
    <h1>Portal de Capacitación</h1>
    <p>La plataforma está en construcción. Muy pronto tendrás aquí los comandos, procesos guiados y tutoriales.</p>
    <div class="status">
      Estado de la infraestructura: <a href="/admin">Directus operativo</a>
    </div>
  </div>
</body>
</html>
